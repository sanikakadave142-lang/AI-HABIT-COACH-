<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AI Habit Coach - Login</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <!-- LOGO -->

            <div class="login-logo">
                🤖
            </div>


            <h1>
                AI Habit Coach
            </h1>


            <p class="subtitle">
                Build better habits, one day at a time.
            </p>


            <!-- ==========================
                 LOGIN FORM
                 ========================== -->

            <form
                id="loginForm"
                autocomplete="on"
            >

                <!-- EMAIL -->

                <div class="login-field">

                    <label for="loginEmail">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="login-field">

                    <label for="loginPassword">
                        🔒 Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- REMEMBER ME -->

                <div class="remember-row">

                    <label class="remember-label">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            checked
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >

                    Login 🚀

                </button>


            </form>


            <!-- REGISTER -->

            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <p class="login-note">
                Your login details will be remembered on this device.
            </p>


        </div>

    </div>


    <!-- ==================================================
         LOGIN JAVASCRIPT
         ================================================== -->

    <script>

        // ==================================================
        // FASTAPI BACKEND
        // ==================================================

        const API_URL =
            "https://ai-habit-coach-backend.onrender.com";


        // ==================================================
        // AUTO-FILL SAVED EMAIL
        // ==================================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const savedEmail =
                    localStorage.getItem(
                        "savedEmail"
                    );


                const emailInput =
                    document.getElementById(
                        "loginEmail"
                    );


                if (
                    savedEmail &&
                    emailInput
                ) {

                    emailInput.value =
                        savedEmail;

                }

            }
        );


        // ==================================================
        // LOGIN FORM
        // ==================================================

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        if (loginForm) {

            loginForm.addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();


                    // ==================================================
                    // GET INPUT VALUES
                    // ==================================================

                    const emailInput =
                        document.getElementById(
                            "loginEmail"
                        );


                    const passwordInput =
                        document.getElementById(
                            "loginPassword"
                        );


                    const rememberMeInput =
                        document.getElementById(
                            "rememberMe"
                        );


                    const email =
                        emailInput
                            ? emailInput.value.trim()
                            : "";


                    const password =
                        passwordInput
                            ? passwordInput.value
                            : "";


                    const rememberMe =
                        rememberMeInput
                            ? rememberMeInput.checked
                            : false;


                    // ==================================================
                    // VALIDATION
                    // ==================================================

                    if (
                        email === "" ||
                        password === ""
                    ) {

                        alert(
                            "Please enter email and password."
                        );

                        return;

                    }


                    // ==================================================
                    // LOGIN BUTTON
                    // ==================================================

                    const loginButton =
                        loginForm.querySelector(
                            'button[type="submit"]'
                        );


                    if (loginButton) {

                        loginButton.disabled =
                            true;

                        loginButton.textContent =
                            "Logging in...";

                    }


                    try {

                        // ==================================================
                        // API REQUEST
                        // ==================================================

                        console.log(
                            "Login API:",
                            API_URL + "/login"
                        );


                        const response =
                            await fetch(
                                API_URL + "/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email: email,
                                            password: password
                                        })
                                }
                            );


                        // ==================================================
                        // READ RESPONSE
                        // ==================================================

                        const data =
                            await response.json();


                        console.log(
                            "Login response:",
                            data
                        );


                        // ==================================================
                        // LOGIN ERROR
                        // ==================================================

                        if (!response.ok) {

                            alert(
                                data.detail ||
                                data.message ||
                                "Invalid email or password."
                            );

                            return;

                        }


                        // ==================================================
                        // GET USER
                        //
                        // FastAPI response:
                        //
                        // {
                        //   success: true,
                        //   message: "Login successful",
                        //   user: {
                        //       id: 2,
                        //       name: "...",
                        //       email: "..."
                        //   }
                        // }
                        //
                        // ==================================================

                        const backendUser =
                            data.user || data;


                        const userId =
                            backendUser.id ||
                            backendUser.user_id;


                        // ==================================================
                        // USER ID CHECK
                        // ==================================================

                        if (
                            userId === undefined ||
                            userId === null ||
                            userId === ""
                        ) {

                            console.error(
                                "No user ID returned:",
                                data
                            );


                            alert(
                                "Login succeeded, but user ID was not returned by the backend."
                            );


                            return;

                        }


                        // ==================================================
                        // USER DETAILS
                        // ==================================================

                        const userName =
                            backendUser.name || "";


                        const userEmail =
                            backendUser.email ||
                            email;


                        // ==================================================
                        // CREATE COMPLETE USER OBJECT
                        // ==================================================

                        const user = {

                            id:
                                Number(userId),

                            name:
                                userName,

                            email:
                                userEmail

                        };


                        console.log(
                            "Logged in user:",
                            user
                        );


                        // ==================================================
                        // SAVE COMPLETE USER
                        // ==================================================

                        localStorage.setItem(
                            "backendUser",
                            JSON.stringify(user)
                        );


                        // ==================================================
                        // SAVE USER ID
                        // ==================================================

                        localStorage.setItem(
                            "user_id",
                            String(user.id)
                        );


                        localStorage.setItem(
                            "userId",
                            String(user.id)
                        );


                        // ==================================================
                        // SAVE USER NAME
                        // ==================================================

                        localStorage.setItem(
                            "userName",
                            user.name
                        );


                        // ==================================================
                        // SAVE USER EMAIL
                        // ==================================================

                        localStorage.setItem(
                            "userEmail",
                            user.email
                        );


                        localStorage.setItem(
                            "loginEmail",
                            user.email
                        );


                        // ==================================================
                        // LOGIN STATUS
                        // ==================================================

                        localStorage.setItem(
                            "loggedIn",
                            "true"
                        );


                        // ==================================================
                        // SAVE EMAIL IF REMEMBER ME
                        // ==================================================

                        if (rememberMe) {

                            localStorage.setItem(
                                "savedEmail",
                                email
                            );

                        } else {

                            localStorage.removeItem(
                                "savedEmail"
                            );

                        }


                        // ==================================================
                        // SUCCESS
                        // ==================================================

                        console.log(
                            "User ID saved:",
                            user.id
                        );


                        alert(
                            "Login successful!"
                        );


                        // ==================================================
                        // GO TO DASHBOARD
                        // ==================================================

                        window.location.href =
                            "dashboard.html";

                    }


                    catch (error) {

                        console.error(
                            "Login error:",
                            error
                        );


                        alert(
                            "Cannot connect to FastAPI backend."
                        );

                    }


                    finally {

                        if (loginButton) {

                            loginButton.disabled =
                                false;

                            loginButton.textContent =
                                "Login 🚀";

                        }

                    }

                }
            );

        }


        // ==================================================
        // SHOW / HIDE PASSWORD
        // ==================================================

        function togglePassword() {

            const passwordInput =
                document.getElementById(
                    "loginPassword"
                );


            const button =
                document.querySelector(
                    ".show-password"
                );


            if (
                !passwordInput ||
                !button
            ) {

                return;

            }


            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                button.textContent =
                    "🙈";

            }

            else {

                passwordInput.type =
                    "password";

                button.textContent =
                    "👁️";

            }

        }

    </script>


    <!-- ==================================================
         MAIN SCRIPT
         ================================================== -->

    <script src="script.js"></script>


</body>

</html>
