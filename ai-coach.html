<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Habit Coach - AI Coach</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>🤖 AI Habit Coach</h2>

        <nav>
            <a href="dashboard.html">🏠 Dashboard</a>
            <a href="habits.html">📋 My Activities</a>
            <a href="progress.html">📊 Progress</a>
            <a href="ai-coach.html" class="active">🤖 AI Coach</a>
        </nav>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="top-header">

            <div>
                <h1>AI Coach 🤖</h1>
                <p>Your personal activity assistant.</p>
            </div>

            <div class="profile">
                👤
            </div>

        </header>


        <!-- AI Coach Container -->
        <section class="chat-container">

            <!-- Chat Header -->
            <div class="chat-header">

                <div class="ai-profile">
                    🤖
                </div>

                <div>
                    <h2>AI Habit Coach</h2>
                    <p>● Online</p>
                </div>

            </div>


            <!-- Chat Messages -->
            <div class="chat-messages" id="chatContainer">

                <div class="message ai-message">

                    <div class="message-icon">
                        🤖
                    </div>

                    <div class="message-content">

                        <p id="welcomeMessage">
                            Hello! 👋 I'm your AI Habit Coach.
                            I can help you improve your daily activities,
                            build good habits and stay consistent. 🌱
                        </p>

                    </div>

                </div>

            </div>


            <!-- Quick Questions -->
            <div class="quick-questions">

                <p>Quick Questions</p>

                <button onclick="quickQuestion('How can I build a new habit?')">
                    🌱 Build a habit
                </button>

                <button onclick="quickQuestion('How can I stay motivated?')">
                    💪 Stay motivated
                </button>

                <button onclick="quickQuestion('How can I improve my consistency?')">
                    📈 Improve consistency
                </button>

                <button onclick="quickQuestion('Show my activity progress')">
                    📊 My progress
                </button>

            </div>


            <!-- Chat Input -->
            <form class="chat-input" id="chatForm">

                <input
                    type="text"
                    id="chatInput"
                    placeholder="Ask your AI Coach..."
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    ➤
                </button>

            </form>

        </section>

    </main>

</div>


<script src="script.js"></script>
</body>
</html>
