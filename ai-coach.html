<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Coach - AI Habit Coach</title>

    <!-- Prevent favicon 404 -->
    <link rel="icon" href="data:,">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(124, 58, 237, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(6, 182, 212, 0.15),
                    transparent 35%
                ),
                #08051c;

            color: #ffffff;
            min-height: 100vh;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    rgba(14, 10, 40, 0.98),
                    rgba(28, 17, 65, 0.98)
                );

            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid rgba(139, 92, 246, 0.4);

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.4),
                0 0 25px rgba(124, 58, 237, 0.1);

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #c4b5fd,
                    #8b5cf6,
                    #22d3ee
                );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            display: inline-block;

            text-decoration: none;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #8b5cf6,
                    #06b6d4
                );

            color: #ffffff;

            padding: 10px 18px;

            border-radius: 10px;

            font-weight: 700;

            box-shadow:
                0 5px 18px rgba(124, 58, 237, 0.35);

            transition: 0.25s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);

            filter: brightness(1.15);

            box-shadow:
                0 8px 25px rgba(124, 58, 237, 0.5);
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            padding: 45px 25px 70px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;

            margin-bottom: 35px;
        }

        .hero h1 {
            margin: 0 0 12px;

            font-size: 42px;

            font-weight: 900;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #c4b5fd,
                    #8b5cf6,
                    #22d3ee
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 30px rgba(139, 92, 246, 0.2);
        }

        .hero p {
            margin: 0;

            color: #cbd5f5;

            font-size: 16px;
        }

        /* =========================
           COACH CARD
        ========================= */

        .coach-card {
            background:
                linear-gradient(
                    135deg,
                    rgba(18, 13, 50, 0.98),
                    rgba(35, 22, 78, 0.98)
                );

            border: 1px solid rgba(139, 92, 246, 0.4);

            border-radius: 22px;

            padding: 28px;

            margin-bottom: 25px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(124, 58, 237, 0.1);

            transition: 0.25s ease;
        }

        .coach-card:hover {
            border-color: rgba(139, 92, 246, 0.8);

            transform: translateY(-2px);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(139, 92, 246, 0.18);
        }

        .coach-card h2 {
            margin: 0 0 20px;

            color: #ffffff;

            font-size: 22px;

            font-weight: 800;
        }

        /* =========================
           QUICK QUESTIONS
        ========================= */

        .quick-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 15px;
        }

        .quick-btn {
            width: 100%;

            border: 1px solid rgba(139, 92, 246, 0.35);

            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.15),
                    rgba(6, 182, 212, 0.08)
                );

            color: #f3f1ff;

            padding: 17px;

            border-radius: 14px;

            cursor: pointer;

            text-align: left;

            font-size: 15px;

            font-weight: 600;

            transition: 0.25s ease;
        }

        .quick-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.35),
                    rgba(6, 182, 212, 0.18)
                );

            border-color: #8b5cf6;

            transform: translateY(-3px);

            box-shadow:
                0 8px 22px rgba(124, 58, 237, 0.25);
        }

        .quick-btn:active {
            transform: translateY(0);
        }

        /* =========================
           QUESTION AREA
        ========================= */

        .question-box {
            display: flex;

            gap: 12px;

            width: 100%;

            margin-top: 20px;
        }

        #aiQuestion {
            flex: 1;

            width: 100%;

            padding: 15px 16px;

            border: 1px solid rgba(139, 92, 246, 0.45);

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            background:
                rgba(8, 5, 28, 0.95);

            color: #ffffff;

            transition: 0.2s ease;
        }

        #aiQuestion::placeholder {
            color: #9ca3af;
        }

        #aiQuestion:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 18px rgba(139, 92, 246, 0.3);
        }

        /* =========================
           ASK AI BUTTON
        ========================= */

        .ask-btn {
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #8b5cf6,
                    #06b6d4
                );

            color: #ffffff;

            padding: 0 25px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 15px;

            font-weight: 800;

            white-space: nowrap;

            box-shadow:
                0 5px 20px rgba(124, 58, 237, 0.35);

            transition: 0.25s ease;
        }

        .ask-btn:hover {
            transform: translateY(-2px);

            filter: brightness(1.15);

            box-shadow:
                0 8px 25px rgba(124, 58, 237, 0.5);
        }

        .ask-btn:active {
            transform: translateY(0);
        }

        /* =========================
           AI RESPONSE
        ========================= */

        .response-box {
            background:
                linear-gradient(
                    135deg,
                    rgba(10, 8, 35, 0.96),
                    rgba(22, 14, 55, 0.96)
                );

            border: 1px solid rgba(139, 92, 246, 0.35);

            border-left: 5px solid #8b5cf6;

            border-radius: 14px;

            padding: 22px;

            margin-top: 25px;

            min-height: 120px;

            box-shadow:
                inset 0 0 20px rgba(124, 58, 237, 0.08);
        }

        .response-title {
            color: #c4b5fd;

            font-size: 17px;

            font-weight: 800;

            margin-bottom: 12px;
        }

        .response-text {
            color: #e5e7eb;

            font-size: 15px;

            line-height: 1.8;

            white-space: pre-wrap;
        }

        /* =========================
           AI ICON
        ========================= */

        .ai-icon {
            width: 60px;
            height: 60px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7,
                    #06b6d4
                );

            box-shadow:
                0 0 25px rgba(139, 92, 246, 0.45);

            font-size: 30px;

            margin-bottom: 15px;
        }

        /* =========================
           LOADING / ERROR
        ========================= */

        .loading {
            color: #22d3ee;

            font-weight: 800;
        }

        .error {
            color: #f87171;

            font-weight: 700;
        }

        /* =========================
           OPTIONAL AI CHAT
        ========================= */

        .ai-coach-container {
            width: 100%;
        }

        .ai-coach-card {
            background:
                linear-gradient(
                    135deg,
                    rgba(14, 12, 45, 0.98),
                    rgba(31, 20, 75, 0.98)
                );

            border: 1px solid rgba(124, 92, 255, 0.6);

            border-radius: 22px;

            padding: 25px;

            color: #ffffff;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(124, 92, 255, 0.15);
        }

        .ai-chat-box {
            background:
                rgba(10, 8, 35, 0.9);

            border: 1px solid rgba(139, 92, 246, 0.35);

            border-radius: 18px;

            padding: 20px;

            color: #ffffff;

            min-height: 180px;
        }

        .user-message {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            color: #ffffff;

            padding: 12px 16px;

            border-radius:
                15px 15px 4px 15px;

            margin:
                10px 0 10px auto;

            max-width: 75%;

            width: fit-content;
        }

        .ai-message {
            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.2),
                    rgba(6, 182, 212, 0.12)
                );

            border: 1px solid rgba(139, 92, 246, 0.35);

            color: #ffffff;

            padding: 14px 16px;

            border-radius:
                15px 15px 15px 4px;

            margin: 10px 0;

            max-width: 80%;
        }

        .ai-input {
            background:
                rgba(10, 8, 35, 0.9);

            border: 1px solid rgba(139, 92, 246, 0.45);

            color: #ffffff;

            border-radius: 12px;

            padding: 13px 15px;

            outline: none;
        }

        .ai-input::placeholder {
            color: #9ca3af;
        }

        .ai-input:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 15px rgba(139, 92, 246, 0.25);
        }

        .ai-button {
            border: none;

            border-radius: 12px;

            padding: 12px 20px;

            font-weight: 800;

            cursor: pointer;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #8b5cf6,
                    #06b6d4
                );

            box-shadow:
                0 5px 20px rgba(124, 58, 237, 0.3);

            transition: 0.2s ease;
        }

        .ai-button:hover {
            transform: translateY(-2px);

            filter: brightness(1.15);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .topbar {
                padding: 15px 16px;
            }

            .logo {
                font-size: 19px;
            }

            .back-btn {
                padding: 9px 13px;

                font-size: 13px;
            }

            .container {
                padding:
                    30px 15px 45px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 14px;
            }

            .coach-card {
                padding: 20px;
            }

            .quick-grid {
                grid-template-columns: 1fr;
            }

            .question-box {
                flex-direction: column;
            }

            .ask-btn {
                width: 100%;

                padding: 14px;
            }

            .user-message,
            .ai-message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <div class="topbar">

        <div class="logo">
            🤖 AI Habit Coach
        </div>

        <a
            href="dashboard.html"
            class="back-btn"
        >
            ← Dashboard
        </a>

    </div>


    <!-- MAIN -->

    <div class="container">

        <!-- HERO -->

        <div class="hero">

            <h1>
                🤖 AI Coach
            </h1>

            <p>
                Ask questions and get personalized habit guidance.
            </p>

        </div>


        <!-- QUICK QUESTIONS -->

        <div class="coach-card">

            <h2>
                Quick Questions
            </h2>

            <div class="quick-grid">

                <button
                    class="quick-btn"
                    type="button"
                    onclick="quickQuestion('How can I build a new habit?')"
                >
                    🌱 How can I build a new habit?
                </button>

                <button
                    class="quick-btn"
                    type="button"
                    onclick="quickQuestion('How can I stay motivated?')"
                >
                    💪 How can I stay motivated?
                </button>

                <button
                    class="quick-btn"
                    type="button"
                    onclick="quickQuestion('How can I improve my study habits?')"
                >
                    📚 How can I improve my study habits?
                </button>

                <button
                    class="quick-btn"
                    type="button"
                    onclick="quickQuestion('How can I improve my sleep routine?')"
                >
                    😴 How can I improve my sleep routine?
                </button>

                <button
                    class="quick-btn"
                    type="button"
                    onclick="quickQuestion('How can I start exercising regularly?')"
                >
                    🏃 How can I start exercising regularly?
                </button>

                <button
                    class="quick-btn"
                    type="button"
                    onclick="quickQuestion('How can I stay consistent with my habits?')"
                >
                    🔥 How can I stay consistent?
                </button>

            </div>

        </div>


        <!-- ASK YOUR OWN QUESTION -->

        <div class="coach-card">

            <h2>
                Ask Your Own Question
            </h2>

            <div class="question-box">

                <input
                    type="text"
                    id="aiQuestion"
                    placeholder="Example: How can I stop procrastinating?"
                    autocomplete="off"
                >

                <button
                    class="ask-btn"
                    type="button"
                    onclick="askAIQuestion()"
                >
                    🤖 Ask AI
                </button>

            </div>


            <!-- AI RESPONSE -->

            <div
                id="aiResponse"
                class="response-box"
            >

                <div class="response-title">
                    🤖 AI Coach Response
                </div>

                <div class="response-text">
                    Ask me a question to get started.
                </div>

            </div>

        </div>

    </div>


    <!-- EXISTING PROJECT JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
