<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Habit Coach - My Activities</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================================
           MY ACTIVITIES PAGE
           ===================================================== */

        .activities-section {
            width: 100%;
            margin-top: 30px;
        }

        .activities-section h2 {
            color: #ffffff !important;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 20px;
        }


        /* =====================================================
           ACTIVITY CARD
           ===================================================== */

        .activity-card {
            background:
                linear-gradient(
                    135deg,
                    rgba(14, 12, 45, 0.98),
                    rgba(31, 20, 75, 0.98)
                ) !important;

            padding: 22px !important;

            margin-bottom: 18px !important;

            border-radius: 20px !important;

            border: 1px solid rgba(124, 92, 255, 0.65) !important;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.40),
                0 0 25px rgba(124, 92, 255, 0.12) !important;

            color: #ffffff !important;

            opacity: 1 !important;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }


        .activity-card:hover {
            transform: translateY(-3px);

            border-color: #8b5cf6 !important;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.50),
                0 0 30px rgba(139, 92, 246, 0.25) !important;
        }


        /* =====================================================
           ACTIVITY TOP
           ===================================================== */

        .activity-top {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 15px;
        }


        /* =====================================================
           ACTIVITY NAME
           ===================================================== */

        .activity-top h3 {
            margin: 0 0 10px 0;

            font-size: 22px;

            font-weight: 800;

            color: #ffffff !important;

            opacity: 1 !important;
        }


        /* =====================================================
           CATEGORY BADGE
           ===================================================== */

        .category-badge {
            display: inline-block;

            padding: 6px 13px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                ) !important;

            color: #ffffff !important;

            font-size: 13px;

            font-weight: 700;

            border: none !important;

            opacity: 1 !important;

            box-shadow:
                0 0 12px rgba(139, 92, 246, 0.25);
        }


        /* =====================================================
           STATUS BADGE
           ===================================================== */

        .status-badge {
            padding: 6px 13px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 700;

            white-space: nowrap;

            opacity: 1 !important;
        }


        .status-badge.completed {
            background:
                rgba(34, 197, 94, 0.18) !important;

            color: #4ade80 !important;

            border: 1px solid rgba(74, 222, 128, 0.40);
        }


        .status-badge.pending {
            background:
                rgba(250, 204, 21, 0.15) !important;

            color: #facc15 !important;

            border: 1px solid rgba(250, 204, 21, 0.35);
        }


        /* =====================================================
           COMPLETED ACTIVITY
           ===================================================== */

        .activity-completed {
            opacity: 1 !important;
        }


        .activity-completed h3 {
            color: #ffffff !important;
        }


        /* =====================================================
           ACTIVITY INFO
           ===================================================== */

        .activity-info {
            margin-top: 12px;

            font-size: 16px;

            color: #dbe4ff !important;

            font-weight: 500;

            opacity: 1 !important;
        }


        .activity-info strong {
            color: #ffffff !important;
        }


        /* =====================================================
           KEEP ALL CARD TEXT CLEAR
           ===================================================== */

        .activity-card h1,
        .activity-card h2,
        .activity-card h3,
        .activity-card h4,
        .activity-card p,
        .activity-card span,
        .activity-card label,
        .activity-card div {
            opacity: 1 !important;
        }


        /* =====================================================
           ACTIVITY BUTTONS
           ===================================================== */

        .activity-buttons {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 20px;
        }


        .activity-buttons button {
            border: none;

            padding: 10px 17px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 700;

            font-size: 14px;

            color: #ffffff !important;

            opacity: 1 !important;

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }


        .activity-buttons button:hover {
            transform: translateY(-2px);

            filter: brightness(1.12);
        }


        /* =====================================================
           COMPLETE BUTTON
           ===================================================== */

        .complete-btn {
            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #22c55e
                ) !important;

            color: #ffffff !important;

            box-shadow:
                0 5px 15px rgba(34, 197, 94, 0.20);
        }


        /* =====================================================
           EDIT BUTTON
           ===================================================== */

        .edit-btn {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                ) !important;

            color: #ffffff !important;
        }


        /* =====================================================
           DELETE BUTTON
           ===================================================== */

        .delete-btn {
            background:
                linear-gradient(
                    135deg,
                    #dc2626,
                    #ef4444
                ) !important;

            color: #ffffff !important;

            box-shadow:
                0 5px 15px rgba(239, 68, 68, 0.15);
        }


        /* =====================================================
           TIMER BOX
           ===================================================== */

        .timer-box {
            margin-top: 18px;

            padding: 16px;

            background:
                rgba(124, 58, 237, 0.12) !important;

            border:
                1px solid rgba(139, 92, 246, 0.35);

            border-radius: 12px;

            color: #ffffff !important;
        }


        .timer-display {
            display: inline-block;

            font-size: 26px;

            font-weight: 800;

            color: #c4b5fd !important;

            margin-right: 10px;

            margin-bottom: 8px;
        }


        .timer-btn {
            border: none;

            padding: 9px 14px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #8b5cf6
                ) !important;

            color: #ffffff !important;
        }


        .stop-timer-btn {
            background:
                linear-gradient(
                    135deg,
                    #dc2626,
                    #ef4444
                ) !important;

            margin-left: 5px;
        }


        /* =====================================================
           EMPTY STATE
           ===================================================== */

        .empty-state {
            text-align: center;

            padding: 45px 25px;

            background:
                linear-gradient(
                    135deg,
                    rgba(14, 12, 45, 0.98),
                    rgba(31, 20, 75, 0.98)
                ) !important;

            border:
                1px solid rgba(124, 92, 255, 0.55);

            border-radius: 20px;

            color: #ffffff !important;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.30);
        }


        .empty-state h3,
        .empty-state p {
            color: #ffffff !important;
        }


        /* =====================================================
           CUSTOM INPUTS
           ===================================================== */

        #customGoal {
            display: none;

            margin-top: 10px;
        }


        #otherCategory {
            display: none;

            margin-top: 10px;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .form-card {
            color: #ffffff;
        }


        .form-card h2 {
            color: #ffffff !important;
        }


        .form-card label {
            color: #e5e7eb !important;
        }


        .form-card input,
        .form-card select {
            color: #ffffff !important;

            background:
                rgba(15, 12, 45, 0.90) !important;

            border:
                1px solid rgba(139, 92, 246, 0.40) !important;
        }


        .form-card input::placeholder {
            color: #9ca3af !important;
        }


        .form-card option {
            background: #15102f;

            color: #ffffff;
        }


        /* =====================================================
           AI SUGGESTION
           ===================================================== */

        .ai-suggestion {
            color: #ffffff !important;
        }


        .ai-suggestion h3 {
            color: #ffffff !important;
        }


        .ai-suggestion p {
            color: #dbe4ff !important;
        }


        /* =====================================================
           MOBILE RESPONSIVE
           ===================================================== */

        @media (max-width: 768px) {

            .activities-section h2 {
                font-size: 25px;
            }


            .activity-card {
                padding: 18px !important;
            }


            .activity-top {
                flex-direction: column;
            }


            .activity-top h3 {
                font-size: 20px;
            }


            .activity-buttons {
                width: 100%;
            }


            .activity-buttons button {
                flex: 1;

                min-width: 100px;
            }

        }

    </style>

</head>


<body>


<div class="dashboard">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <h2>AI Habit Coach</h2>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="habits.html" class="active">
                My Activities
            </a>

            <a href="progress.html">
                Progress
            </a>

            <a href="ai-coach.html">
                AI Coach
            </a>

        </nav>


        <button
            type="button"
            onclick="logout()"
            class="logout-btn"
        >
            Logout
        </button>

    </aside>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main-content">


        <h1>My Activities</h1>

        <p>
            Add and manage your daily activities.
        </p>



        <!-- =================================================
             ADD ACTIVITY FORM
             ================================================= -->

        <div class="form-card">

            <h2>Add Activity</h2>


            <form id="habitForm">


                <!-- ACTIVITY NAME -->

                <div class="form-group">

                    <label for="habitName">
                        Activity Name
                    </label>

                    <input
                        type="text"
                        id="habitName"
                        placeholder="Example: Exercise"
                        required
                    >

                </div>



                <!-- GOAL / TIME -->

                <div class="form-group">

                    <label for="habitGoalSelect">
                        Goal / Time
                    </label>

                    <select
                        id="habitGoalSelect"
                        required
                    >

                        <option value="">
                            Select Goal / Time
                        </option>

                        <option value="5 Minutes">
                            5 Minutes
                        </option>

                        <option value="10 Minutes">
                            10 Minutes
                        </option>

                        <option value="15 Minutes">
                            15 Minutes
                        </option>

                        <option value="20 Minutes">
                            20 Minutes
                        </option>

                        <option value="30 Minutes">
                            30 Minutes
                        </option>

                        <option value="45 Minutes">
                            45 Minutes
                        </option>

                        <option value="60 Minutes">
                            60 Minutes
                        </option>

                        <option value="90 Minutes">
                            90 Minutes
                        </option>

                        <option value="120 Minutes">
                            120 Minutes
                        </option>

                        <option value="1 Hour">
                            1 Hour
                        </option>

                        <option value="2 Hours">
                            2 Hours
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <!-- CUSTOM GOAL -->

                    <input
                        type="text"
                        id="habitGoal"
                        placeholder="Example: 25 Minutes"
                    >

                </div>



                <!-- =================================================
                     CATEGORY
                     ================================================= -->

                <div class="form-group">

                    <label for="habitCategory">
                        Category
                    </label>

                    <select
                        id="habitCategory"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Study">
                            Study
                        </option>

                        <option value="Fitness">
                            Fitness
                        </option>

                        <option value="Personal">
                            Personal
                        </option>

                        <option value="Lifestyle">
                            Lifestyle
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <!-- CUSTOM CATEGORY -->

                    <input
                        type="text"
                        id="otherCategory"
                        placeholder="Type your own category..."
                    >

                </div>



                <!-- =================================================
                     REMINDER
                     ================================================= -->

                <div class="form-group">

                    <label for="reminderTime">
                        Reminder Time
                    </label>

                    <input
                        type="time"
                        id="reminderTime"
                    >

                </div>



                <!-- =================================================
                     FORM BUTTONS
                     ================================================= -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        id="habitSubmitBtn"
                    >
                        Add Activity
                    </button>


                    <button
                        type="button"
                        id="cancelEditBtn"
                        style="display: none;"
                    >
                        Cancel
                    </button>

                </div>


            </form>

        </div>



        <!-- =====================================================
             AI SUGGESTION
             ===================================================== -->

        <div class="ai-suggestion">

            <h3>🤖 AI Coach Suggestion</h3>

            <p id="aiSuggestion">
                Add an activity to get AI suggestions.
            </p>

        </div>



        <!-- =====================================================
             ACTIVITIES
             ===================================================== -->

        <div class="activities-section">

            <h2>
                Your Activities
            </h2>


            <div id="habitsList"></div>

        </div>


    </main>

</div>



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="script.js"></script>


</body>

</html>
