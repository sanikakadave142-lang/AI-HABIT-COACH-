<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Habit Coach - My Activities</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .activity-card {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .activity-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .activity-top h3 {
            margin: 0 0 8px 0;
            font-size: 20px;
        }

        .category-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #ede9fe;
            color: #6d28d9;
            font-size: 13px;
            font-weight: 600;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-badge.completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .activity-completed {
            opacity: 0.75;
        }

        .activity-info {
            margin-top: 10px;
            font-size: 15px;
        }

        .activity-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .activity-buttons button {
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .complete-btn {
            background: #22c55e;
            color: white;
        }

        .edit-btn {
            background: #3b82f6;
            color: white;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        /* TIMER */

        .timer-box {
            margin-top: 15px;
            padding: 14px;
            background: #f5f3ff;
            border-radius: 10px;
        }

        .timer-display {
            display: inline-block;
            font-size: 24px;
            font-weight: 700;
            color: #6d28d9;
            margin-right: 10px;
            margin-bottom: 8px;
        }

        .timer-btn {
            border: none;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            background: #7c3aed;
            color: white;
        }

        .stop-timer-btn {
            background: #ef4444;
            margin-left: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
        }

        /* CUSTOM INPUTS */

        #customGoal {
            display: none;
            margin-top: 10px;
        }

        #otherCategory {
            display: none;
            margin-top: 10px;
        }

    </style>

</head>


<body>


<div class="dashboard">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>AI Habit Coach</h2>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="habits.html" class="active">
                My Activities
            </a>

            <a href="progress.html">
                Progress
            </a>

            <a href="ai-coach.html">
                AI Coach
            </a>

        </nav>


        <button
            onclick="logout()"
            class="logout-btn"
        >
            Logout
        </button>

    </aside>



    <!-- MAIN -->

    <main class="main-content">


        <h1>My Activities</h1>

        <p>
            Add and manage your daily activities.
        </p>



        <!-- ADD ACTIVITY FORM -->

        <div class="form-card">

            <h2>Add Activity</h2>


            <form id="habitForm">


                <!-- ACTIVITY NAME -->

                <div class="form-group">

                    <label for="habitName">
                        Activity Name
                    </label>

                    <input
                        type="text"
                        id="habitName"
                        placeholder="Example: Exercise"
                        required
                    >

                </div>



                <!-- GOAL / TIME -->

                <div class="form-group">

                    <label for="habitGoalSelect">
                        Goal / Time
                    </label>

                    <select id="habitGoalSelect" required>

                        <option value="">
                            Select Goal / Time
                        </option>

                        <option value="5 Minutes">
                            5 Minutes
                        </option>

                        <option value="10 Minutes">
                            10 Minutes
                        </option>

                        <option value="15 Minutes">
                            15 Minutes
                        </option>

                        <option value="20 Minutes">
                            20 Minutes
                        </option>

                        <option value="30 Minutes">
                            30 Minutes
                        </option>

                        <option value="45 Minutes">
                            45 Minutes
                        </option>

                        <option value="60 Minutes">
                            60 Minutes
                        </option>

                        <option value="90 Minutes">
                            90 Minutes
                        </option>

                        <option value="120 Minutes">
                            120 Minutes
                        </option>

                        <option value="1 Hour">
                            1 Hour
                        </option>

                        <option value="2 Hours">
                            2 Hours
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <!-- CUSTOM GOAL -->

                    <input
                        type="text"
                        id="habitGoal"
                        placeholder="Example: 25 Minutes"
                    >

                </div>



                <!-- CATEGORY -->

                <div class="form-group">

                    <label for="habitCategory">
                        Category
                    </label>

                    <select id="habitCategory" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Health">
                            Health
                        </option>

                        <option value="Study">
                            Study
                        </option>

                        <option value="Fitness">
                            Fitness
                        </option>

                        <option value="Personal">
                            Personal
                        </option>

                        <option value="Lifestyle">
                            Lifestyle
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>


                    <!-- CUSTOM CATEGORY -->

                    <input
                        type="text"
                        id="otherCategory"
                        placeholder="Type your own category..."
                    >

                </div>



                <!-- REMINDER -->

                <div class="form-group">

                    <label for="reminderTime">
                        Reminder Time
                    </label>

                    <input
                        type="time"
                        id="reminderTime"
                    >

                </div>



                <!-- BUTTONS -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        id="habitSubmitBtn"
                    >
                        Add Activity
                    </button>


                    <button
                        type="button"
                        id="cancelEditBtn"
                        style="display:none;"
                    >
                        Cancel
                    </button>

                </div>


            </form>

        </div>



        <!-- AI SUGGESTION -->

        <div class="ai-suggestion">

            <h3>🤖 AI Coach Suggestion</h3>

            <p id="aiSuggestion">
                Add an activity to get AI suggestions.
            </p>

        </div>



        <!-- ACTIVITIES -->

        <div class="activities-section">

            <h2>
                Your Activities
            </h2>


            <div id="habitsList"></div>

        </div>


    </main>

</div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
